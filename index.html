<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07050d">
<title>ANKY MUSIC HUB</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
<style>
/* ============================================================
   ANKY MUSIC HUB — PREMIUM BLACK / VIOLET THEME
   ============================================================ */
:root{
  --bg:#07050d;
  --bg-2:#0d0818;
  --card:#130d22;
  --card-2:#1a1130;
  --line:#2a1b4d;
  --line-2:#3b2668;
  --v:#8b5cf6;
  --v-2:#a78bfa;
  --v-3:#c084fc;
  --v-4:#6d28d9;
  --tx:#f4effe;
  --tx-2:#d8cef0;
  --mut:#9a8cc0;
  --mut-2:#6f6291;
  --premium-border:rgba(139,92,246,.35);
  --premium-glow:0 0 18px rgba(139,92,246,.25);
  --premium-glow-strong:0 0 28px rgba(139,92,246,.5);
  --radius:16px;
  --radius-sm:12px;
  --radius-xs:10px;
  --search-radius:99px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* ---------- RESET ---------- */
*,
*::before,
*::after{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  height:100%;
  width:100%;
}

html{
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
  scroll-behavior:smooth;
}

body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
  background:var(--bg);
  color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;
  line-height:1.5;
  background-image:
    radial-gradient(900px 500px at 80% -10%,#2b1260 0,transparent 60%),
    radial-gradient(700px 400px at 10% 110%,#1a0f3a 0,transparent 55%),
    linear-gradient(180deg,#07050d 0%,#0a0714 100%);
  background-attachment:fixed;
  overflow:hidden;
}

button{
  font:inherit;
  color:inherit;
  background:none;
  border:0;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
  touch-action:manipulation;
}

input{
  font:inherit;
  color:inherit;
}

img,
svg{
  display:block;
  max-width:100%;
}

ul,
ol{
  list-style:none;
}

a{
  color:var(--v-3);
  text-decoration:none;
}

a:hover{
  text-decoration:underline;
}

::selection{
  background:var(--v);
  color:#fff;
}

::-webkit-scrollbar{
  width:8px;
  height:8px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:var(--line-2);
  border-radius:8px;
}

::-webkit-scrollbar-thumb:hover{
  background:var(--v);
}

/* ---------- HEADER ---------- */
header{
  flex:none;
  padding:22px 20px 10px;
  text-align:center;
  position:relative;
  z-index:2;
}

.logo{
  font-size:clamp(26px,7vw,42px);
  font-weight:900;
  letter-spacing:2px;
  line-height:1.1;
  background:linear-gradient(90deg,#a78bfa,#e879f9,#8b5cf6);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 30px #8b5cf655;
  display:inline-block;
  padding:0 4px;
}

.tag{
  color:var(--mut);
  font-size:12px;
  letter-spacing:4px;
  margin-top:4px;
  text-transform:uppercase;
  font-weight:500;
}

/* ---------- PREMIUM SEARCH BAR ---------- */
.tools{
  display:flex;
  gap:10px;
  max-width:760px;
  width:100%;
  margin:14px auto 0;
  padding:0 16px;
  align-items:center;
}

.search-wrap{
  flex:1;
  min-width:0;
  position:relative;
  display:flex;
  align-items:center;
  height:46px;
  border-radius:var(--search-radius);
  border:1px solid var(--premium-border);
  background:linear-gradient(135deg,rgba(19,13,34,.95),rgba(30,20,55,.95));
  box-shadow:var(--premium-glow),inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .25s ease,box-shadow .25s ease,transform .15s ease;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}

.search-wrap:hover{
  border-color:rgba(139,92,246,.55);
}

.search-wrap:focus-within{
  border-color:var(--v);
  box-shadow:0 0 24px rgba(139,92,246,.45),inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateY(-1px);
}

.search-wrap .icon{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 6px 0 16px;
  color:var(--mut);
  font-size:16px;
  opacity:.7;
  pointer-events:none;
  flex:none;
}

.search-wrap input[type=search]{
  flex:1;
  min-width:0;
  height:100%;
  border:0;
  background:transparent;
  color:var(--tx);
  padding:0 10px 0 4px;
  font-size:15px;
  outline:0;
  -webkit-appearance:none;
  appearance:none;
}

.search-wrap input[type=search]::placeholder{
  color:var(--mut);
  font-weight:400;
  opacity:.8;
}

.search-wrap input[type=search]::-webkit-search-cancel-button{
  -webkit-appearance:none;
  appearance:none;
  display:none;
}

.search-wrap .shortcut{
  display:none;
  font-size:11px;
  color:var(--mut);
  border:1px solid var(--line);
  border-radius:6px;
  padding:2px 6px;
  margin-right:12px;
  opacity:.6;
  flex:none;
  font-weight:600;
  letter-spacing:.5px;
  background:rgba(255,255,255,.03);
}

@media(min-width:600px){
  .search-wrap .shortcut{display:inline}
}

.add{
  height:46px;
  padding:0 18px;
  border-radius:99px;
  background:linear-gradient(135deg,var(--v),var(--v-4));
  font-weight:700;
  font-size:14px;
  white-space:nowrap;
  box-shadow:0 0 18px #8b5cf655;
  border:1px solid rgba(255,255,255,.08);
  transition:transform .15s ease,box-shadow .2s ease,filter .2s ease;
  display:inline-flex;
  align-items:center;
  gap:6px;
  letter-spacing:.3px;
  flex:none;
}

.add:hover{
  transform:scale(1.03);
  box-shadow:0 0 26px #8b5cf6aa;
  filter:brightness(1.1);
}

.add:active{
  transform:scale(.97);
}

/* ---------- MAIN ---------- */
main{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  max-width:760px;
  width:100%;
  margin:0 auto;
  padding:12px 16px 24px;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  position:relative;
  z-index:1;
}

main h2{
  font-size:13px;
  letter-spacing:2px;
  color:var(--mut);
  margin:10px 4px 10px;
  font-weight:700;
  text-transform:uppercase;
}

/* ---------- SONG LIST ---------- */
.song{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px;
  border-radius:14px;
  cursor:pointer;
  border:1px solid transparent;
  transition:background .18s ease,border-color .18s ease,transform .12s ease;
  position:relative;
  -webkit-user-select:none;
  user-select:none;
}

.song:hover{
  background:var(--card);
}

.song:active{
  transform:scale(.985);
}

.song.on{
  background:linear-gradient(90deg,#2a1260,#130d22);
  border-color:var(--v);
  box-shadow:0 0 20px rgba(139,92,246,.18);
}

.cv{
  width:48px;
  height:48px;
  border-radius:12px;
  flex:none;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:18px;
  background:linear-gradient(135deg,var(--h1,#8b5cf6),var(--h2,#4c1d95));
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,.3);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
  letter-spacing:.5px;
}

.song b{
  display:block;
  font-size:15px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--tx);
  line-height:1.3;
}

.song small{
  color:var(--mut);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  line-height:1.3;
}

.song div:nth-child(2){
  min-width:0;
  flex:1;
}

.song > small{
  color:var(--v-3);
  font-size:11px;
  flex:none;
  font-weight:600;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:var(--mut);
  padding:48px 16px;
  font-size:14px;
  line-height:1.8;
  border:1px dashed var(--line);
  border-radius:var(--radius);
  margin:20px 0;
  background:rgba(19,13,34,.4);
}

/* ---------- FOOTER PLAYER ---------- */
footer{
  flex:none;
  background:rgba(13,8,24,.95);
  border-top:1px solid var(--line);
  padding:12px 16px calc(10px + var(--safe-bottom));
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  position:relative;
  z-index:3;
  box-shadow:0 -8px 30px rgba(0,0,0,.4);
}

.np{
  max-width:760px;
  margin:0 auto;
}

.now{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:8px;
}

.now .cv{
  width:44px;
  height:44px;
  font-size:16px;
}

.now b{
  display:block;
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  color:var(--tx);
  line-height:1.3;
}

.now small{
  color:var(--mut);
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:block;
  line-height:1.3;
}

.now > div:nth-child(2){
  min-width:0;
  flex:1;
}

/* Equalizer animation */
.eq{
  display:flex;
  gap:3px;
  align-items:flex-end;
  height:18px;
  flex:none;
}

.eq i{
  width:3px;
  height:4px;
  background:var(--v-3);
  border-radius:2px;
  display:block;
  transition:height .2s ease;
}

.play .eq i{
  animation:eq .8s infinite ease-in-out;
}

.eq i:nth-child(2){
  animation-delay:.2s !important;
}

.eq i:nth-child(3){
  animation-delay:.4s !important;
}

.eq i:nth-child(4){
  animation-delay:.1s !important;
}

@keyframes eq{
  0%,100%{height:4px}
  50%{height:18px}
}

/* Progress bar */
.bar{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:11px;
  color:var(--mut);
  font-variant-numeric:tabular-nums;
  margin-bottom:2px;
}

.bar span{
  flex:none;
  min-width:32px;
  text-align:center;
  font-weight:500;
}

input[type=range]{
  -webkit-appearance:none;
  appearance:none;
  flex:1;
  height:5px;
  border-radius:9px;
  background:linear-gradient(90deg,var(--v) var(--p,0%),#2a1b4d var(--p,0%));
  outline:0;
  cursor:pointer;
  min-width:0;
}

input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px var(--v);
  cursor:pointer;
  transition:transform .15s ease;
}

input[type=range]::-webkit-slider-thumb:hover{
  transform:scale(1.2);
}

input[type=range]::-moz-range-thumb{
  width:14px;
  height:14px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 0 8px var(--v);
  cursor:pointer;
}

input[type=range]:focus-visible{
  outline:2px solid var(--v-2);
  outline-offset:4px;
}

/* Controls */
.ctl{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-top:6px;
  flex-wrap:nowrap;
}

.ctl button{
  width:42px;
  height:42px;
  border-radius:50%;
  font-size:18px;
  display:grid;
  place-items:center;
  color:var(--mut);
  transition:color .18s ease,background .18s ease,transform .12s ease;
  flex:none;
}

.ctl button:hover{
  color:var(--tx);
  background:rgba(139,92,246,.1);
}

.ctl button:active{
  transform:scale(.9);
}

.ctl button.on{
  color:var(--v-3);
  background:rgba(139,92,246,.12);
}

.ctl .pp{
  width:56px;
  height:56px;
  font-size:22px;
  color:#fff;
  background:linear-gradient(135deg,var(--v),var(--v-4));
  box-shadow:0 0 22px #8b5cf6aa;
  transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;
}

.ctl .pp:hover{
  transform:scale(1.05);
  box-shadow:0 0 30px #8b5cf6cc;
  filter:brightness(1.08);
}

.ctl .pp:active{
  transform:scale(.94);
}

.vol{
  width:90px;
  flex:none;
}

.volic{
  font-size:14px;
  flex:none;
  opacity:.8;
  user-select:none;
}

/* Credit line */
.credit{
  text-align:center;
  margin-top:8px;
  font-size:12px;
  letter-spacing:2px;
  color:var(--mut);
  text-transform:uppercase;
  font-weight:500;
}

.credit b{
  color:var(--v-3);
  font-weight:700;
  letter-spacing:2.5px;
}

/* ---------- RESPONSIVE ---------- */
@media(max-width:520px){
  .vol,
  .volic{
    display:none;
  }

  header{
    padding:18px 16px 6px;
  }

  .tools{
    padding:0 12px;
  }

  main{
    padding:10px 12px 20px;
  }

  footer{
    padding:10px 12px calc(8px + var(--safe-bottom));
  }

  .ctl{
    gap:6px;
  }

  .ctl button{
    width:38px;
    height:38px;
    font-size:16px;
  }

  .ctl .pp{
    width:50px;
    height:50px;
    font-size:20px;
  }
}

@media(max-width:380px){
  .add{
    padding:0 14px;
    font-size:13px;
  }

  .song{
    gap:10px;
    padding:8px;
  }

  .cv{
    width:42px;
    height:42px;
    font-size:16px;
  }

  .song b{
    font-size:14px;
  }

  .now .cv{
    width:40px;
    height:40px;
  }

  .ctl button{
    width:34px;
    height:34px;
  }

  .ctl .pp{
    width:46px;
    height:46px;
  }
}

/* Reduce motion */
@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* Focus visible for accessibility */
button:focus-visible,
input:focus-visible{
  outline:2px solid var(--v-2);
  outline-offset:2px;
}
</style>
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header>
  <div class="logo">ANKY MUSIC HUB</div>
  <div class="tag">PREMIUM SOUND EXPERIENCE</div>
  <div class="tools">
    <div class="search-wrap">
      <span class="icon" aria-hidden="true">🔍</span>
      <input type="search" id="q" placeholder="Search songs or artists..." aria-label="Search songs or artists" autocomplete="off" spellcheck="false">
      <span class="shortcut" aria-hidden="true">⌘K</span>
    </div>
    <button class="add" id="addBtn" type="button">+ Add Songs</button>
    <input type="file" id="file" accept="audio/*" multiple hidden>
  </div>
</header>

<!-- ==================== MAIN LIBRARY ==================== -->
<main>
  <h2>Your Library</h2>
  <div id="list"></div>
</main>

<!-- ==================== FOOTER PLAYER ==================== -->
<footer>
  <div class="np" id="np">
    <div class="now">
      <div class="cv" id="ncv">♪</div>
      <div>
        <b id="nt">Select a song</b>
        <small id="na">ANKY MUSIC HUB</small>
      </div>
      <div class="eq" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
    </div>
    <div class="bar">
      <span id="cur">0:00</span>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:00</span>
    </div>
    <div class="ctl">
      <button id="shuf" title="Shuffle" aria-label="Shuffle" type="button">⤮</button>
      <button id="prev" title="Previous" aria-label="Previous track" type="button">⏮</button>
      <button class="pp" id="pp" title="Play / Pause" aria-label="Play or pause" type="button">▶</button>
      <button id="next" title="Next" aria-label="Next track" type="button">⏭</button>
      <button id="rep" title="Repeat" aria-label="Repeat" type="button">⟲</button>
      <span class="volic" aria-hidden="true">🔊</span>
      <input class="vol" type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
    <div class="credit">Designed by <b>ANIKESH</b></div>
  </div>
</footer>

<!-- ==================== AUDIO ELEMENT ==================== -->
<audio id="a" preload="metadata"></audio>

<!-- ==================== SCRIPT ==================== -->
<script>
(function(){
  "use strict";

  /* ----------------------------------------------------------
     DOM REFERENCES
     ---------------------------------------------------------- */
  const $ = (sel, ctx) => (ctx || document).querySelector(sel);
  const $$ = (sel, ctx) => Array.prototype.slice.call((ctx || document).querySelectorAll(sel));
  const A = $('#a');

  /* ----------------------------------------------------------
     STATE
     ---------------------------------------------------------- */
  let songs = [];       // { title, artist, url }
  let view = [];        // filtered [{ s, i }]
  let idx = -1;         // currently playing index in songs[]
  let shuf = false;     // shuffle on/off
  let rep = false;      // repeat one on/off
  let isSeeking = false;

  /* ----------------------------------------------------------
     HELPERS
     ---------------------------------------------------------- */
  function esc(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function hashHue(text){
    let h = 0;
    for(let i = 0; i < text.length; i++){
      h = (h * 31 + text.charCodeAt(i)) % 60;
    }
    return h;
  }

  function coverGradient(title){
    const h = 260 + hashHue(title || '♪');
    return '--h1:hsl(' + h + ',80%,55%);--h2:hsl(' + (h + 40) + ',70%,30%)';
  }

  function firstLetter(title){
    const t = (title || '').trim();
    return (t ? t[0] : '♪').toUpperCase();
  }

  /* ----------------------------------------------------------
     RENDER SONG LIST
     ---------------------------------------------------------- */
  function render(){
    const q = ($('#q').value || '').trim().toLowerCase();

    view = songs
      .map(function(s, i){ return { s: s, i: i }; })
      .filter(function(x){
        if(!q) return true;
        const hay = (x.s.title + ' ' + x.s.artist).toLowerCase();
        return hay.indexOf(q) !== -1;
      });

    const list = $('#list');

    if(view.length === 0){
      list.innerHTML =
        '<div class="empty">' +
          'No songs found.<br>' +
          'Tap <b>+ Add Songs</b> to play music from your device.' +
        '</div>';
      return;
    }

    let html = '';
    for(let k = 0; k < view.length; k++){
      const item = view[k];
      const s = item.s;
      const i = item.i;
      const isOn = (i === idx);
      const playing = isOn && !A.paused;

      html +=
        '<div class="song' + (isOn ? ' on' : '') + '" data-i="' + i + '" role="button" tabindex="0">' +
          '<div class="cv" style="' + coverGradient(s.title) + '">' +
            esc(firstLetter(s.title)) +
          '</div>' +
          '<div>' +
            '<b>' + esc(s.title) + '</b>' +
            '<small>' + esc(s.artist) + '</small>' +
          '</div>' +
          '<small>' + (playing ? '▶ Playing' : '') + '</small>' +
        '</div>';
    }
    list.innerHTML = html;
  }

  /* ----------------------------------------------------------
     PLAY A SONG BY INDEX
     ---------------------------------------------------------- */
  function play(i){
    if(i < 0 || i >= songs.length) return;

    idx = i;
    const s = songs[i];

    // Set source and start playback
    A.src = s.url;
    const p = A.play();
    if(p && typeof p.catch === 'function'){
      p.catch(function(){ /* autoplay may be blocked */ });
    }

    // Update now-playing UI
    $('#nt').textContent = s.title;
    $('#na').textContent = s.artist;

    const cover = $('#ncv');
    cover.setAttribute('style', coverGradient(s.title));
    cover.textContent = firstLetter(s.title);

    // Media Session API (lock screen / notification controls)
    if('mediaSession' in navigator){
      try{
        navigator.mediaSession.metadata = new MediaMetadata({
          title: s.title,
          artist: s.artist,
          album: 'ANKY MUSIC HUB'
        });
        navigator.mediaSession.setActionHandler('play', function(){ A.play(); });
        navigator.mediaSession.setActionHandler('pause', function(){ A.pause(); });
        navigator.mediaSession.setActionHandler('previoustrack', function(){ $('#prev').click(); });
        navigator.mediaSession.setActionHandler('nexttrack', function(){ $('#next').click(); });
      } catch(e){ /* ignore */ }
    }

    // Reset seek bar
    const seek = $('#seek');
    seek.value = 0;
    seek.style.setProperty('--p', '0%');
    $('#cur').textContent = '0:00';

    render();
  }

  /* ----------------------------------------------------------
     NEXT / PREVIOUS INDEX
     ---------------------------------------------------------- */
  function nextIdx(dir){
    if(songs.length === 0) return -1;

    if(shuf && songs.length > 1){
      let r;
      do{
        r = Math.floor(Math.random() * songs.length);
      } while(r === idx);
      return r;
    }

    return (idx + dir + songs.length) % songs.length;
  }

  /* ----------------------------------------------------------
     EVENT: SONG CLICK (delegated)
     ---------------------------------------------------------- */
  $('#list').addEventListener('click', function(e){
    const el = e.target.closest('.song');
    if(!el) return;
    const i = parseInt(el.getAttribute('data-i'), 10);
    if(!isNaN(i)) play(i);
  });

  // Keyboard support on song rows
  $('#list').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest('.song');
    if(!el) return;
    e.preventDefault();
    const i = parseInt(el.getAttribute('data-i'), 10);
    if(!isNaN(i)) play(i);
  });

  /* ----------------------------------------------------------
     EVENT: SEARCH
     ---------------------------------------------------------- */
  $('#q').addEventListener('input', render);

  /* ----------------------------------------------------------
     EVENT: PLAY / PAUSE
     ---------------------------------------------------------- */
  $('#pp').addEventListener('click', function(){
    if(idx < 0){
      if(songs.length) play(0);
      return;
    }
    if(A.paused){
      A.play().catch(function(){});
    } else {
      A.pause();
    }
  });

  /* ----------------------------------------------------------
     EVENT: NEXT
     ---------------------------------------------------------- */
  $('#next').addEventListener('click', function(){
    play(nextIdx(1));
  });

  /* ----------------------------------------------------------
     EVENT: PREVIOUS (restart if > 3s)
     ---------------------------------------------------------- */
  $('#prev').addEventListener('click', function(){
    if(A.currentTime > 3){
      A.currentTime = 0;
    } else {
      play(nextIdx(-1));
    }
  });

  /* ----------------------------------------------------------
     EVENT: SHUFFLE TOGGLE
     ---------------------------------------------------------- */
  $('#shuf').addEventListener('click', function(e){
    shuf = !shuf;
    e.currentTarget.classList.toggle('on', shuf);
  });

  /* ----------------------------------------------------------
     EVENT: REPEAT TOGGLE
     ---------------------------------------------------------- */
  $('#rep').addEventListener('click', function(e){
    rep = !rep;
    e.currentTarget.classList.toggle('on', rep);
  });

  /* ----------------------------------------------------------
     EVENT: VOLUME
     ---------------------------------------------------------- */
  (function initVolume(){
    const vol = $('#vol');
    A.volume = 0.8;

    function updateVol(){
      const v = parseInt(vol.value, 10);
      A.volume = v / 100;
      vol.style.setProperty('--p', v + '%');
    }

    vol.addEventListener('input', updateVol);
    vol.addEventListener('change', updateVol);
    updateVol();
  })();

  /* ----------------------------------------------------------
     EVENT: SEEK BAR
     ---------------------------------------------------------- */
  (function initSeek(){
    const seek = $('#seek');

    seek.addEventListener('pointerdown', function(){ isSeeking = true; });
    seek.addEventListener('pointerup', function(){ isSeeking = false; });
    seek.addEventListener('pointercancel', function(){ isSeeking = false; });

    seek.addEventListener('input', function(){
      isSeeking = true;
      if(A.duration && isFinite(A.duration)){
        A.currentTime = (seek.value / 1000) * A.duration;
      }
      seek.style.setProperty('--p', (seek.value / 10) + '%');
      $('#cur').textContent = fmtTime(A.currentTime);
    });

    seek.addEventListener('change', function(){
      isSeeking = false;
    });
  })();

  /* ----------------------------------------------------------
     AUDIO EVENTS
     ---------------------------------------------------------- */
  A.addEventListener('timeupdate', function(){
    if(!A.duration || !isFinite(A.duration)) return;

    const v = (A.currentTime / A.duration) * 1000;
    const seek = $('#seek');

    if(!isSeeking && document.activeElement !== seek){
      seek.value = v;
    }
    seek.style.setProperty('--p', (v / 10) + '%');
    $('#cur').textContent = fmtTime(A.currentTime);
  });

  A.addEventListener('loadedmetadata', function(){
    $('#dur').textContent = fmtTime(A.duration);
    const seek = $('#seek');
    if(A.duration && isFinite(A.duration) && A.currentTime > 0){
      const v = (A.currentTime / A.duration) * 1000;
      seek.value = v;
      seek.style.setProperty('--p', (v / 10) + '%');
    }
  });

  A.addEventListener('durationchange', function(){
    $('#dur').textContent = fmtTime(A.duration);
  });

  function syncPlayState(){
    const pp = $('#pp');
    pp.textContent = A.paused ? '▶' : '⏸';
    pp.setAttribute('aria-label', A.paused ? 'Play' : 'Pause');
    $('#np').classList.toggle('play', !A.paused);
    render();
  }

  A.addEventListener('play', syncPlayState);
  A.addEventListener('pause', syncPlayState);
  A.addEventListener('playing', syncPlayState);
  A.addEventListener('waiting', function(){
    // optional: could show a spinner
  });

  A.addEventListener('ended', function(){
    if(rep){
      A.currentTime = 0;
      A.play().catch(function(){});
    } else {
      play(nextIdx(1));
    }
  });

  A.addEventListener('error', function(){
    // Skip broken track after a short delay
    if(A.getAttribute('src') && songs.length > 1){
      setTimeout(function(){ play(nextIdx(1)); }, 600);
    }
  });

  /* ----------------------------------------------------------
     ADD SONGS FROM DEVICE
     ---------------------------------------------------------- */
  $('#addBtn').addEventListener('click', function(){
    $('#file').click();
  });

  $('#file').addEventListener('change', function(e){
    const files = Array.prototype.slice.call(e.target.files || []);
    if(files.length === 0) return;

    files.forEach(function(f){
      const base = f.name.replace(/\.[^.]+$/, '');
      const dash = base.indexOf(' - ');
      const title = dash > 0 ? base.slice(dash + 3).trim() : base.trim();
      const artist = dash > 0 ? base.slice(0, dash).trim() : 'My Device';

      songs.push({
        title: title || 'Untitled',
        artist: artist || 'Unknown',
        url: URL.createObjectURL(f)
      });
    });

    e.target.value = '';
    render();

    if(idx < 0 && songs.length > 0){
      play(0);
    }
  });

  /* ----------------------------------------------------------
     LOAD SONGS FROM SERVER /music (optional)
     ---------------------------------------------------------- */
  function loadServerSongs(){
    fetch('/api/songs', { cache: 'no-store' })
      .then(function(r){
        if(!r.ok) throw new Error('no server songs');
        return r.json();
      })
      .then(function(list){
        if(Array.isArray(list) && list.length){
          // Normalise shape
          const normalised = list.map(function(x){
            if(typeof x === 'string'){
              return { title: x, artist: 'Server', url: '/music/' + encodeURIComponent(x) };
            }
            return {
              title: x.title || x.name || 'Untitled',
              artist: x.artist || 'Server',
              url: x.url || ('/music/' + encodeURIComponent(x.file || x.title || ''))
            };
          });
          songs = normalised.concat(songs);
        }
        render();
      })
      .catch(function(){
        render();
      });
  }

  /* ----------------------------------------------------------
     KEYBOARD SHORTCUTS
     ---------------------------------------------------------- */
  document.addEventListener('keydown', function(e){
    // ⌘K / Ctrl+K → focus search
    if((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')){
      e.preventDefault();
      $('#q').focus();
      $('#q').select();
      return;
    }

    // Space → play/pause (only if not typing in an input)
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(e.key === ' ' && tag !== 'INPUT' && tag !== 'TEXTAREA'){
      e.preventDefault();
      $('#pp').click();
      return;
    }

    // Arrow keys for seek
    if(e.key === 'ArrowRight' && tag !== 'INPUT'){
      A.currentTime = Math.min(A.duration || 0, A.currentTime + 5);
    }
    if(e.key === 'ArrowLeft' && tag !== 'INPUT'){
      A.currentTime = Math.max(0, A.currentTime - 5);
    }
  });

  /* ----------------------------------------------------------
     BOOT
     ---------------------------------------------------------- */
  render();
  loadServerSongs();

})();
</script>
</body>
</html>
